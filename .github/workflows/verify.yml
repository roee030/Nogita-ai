name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up pinned Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Run behavior tests
        run: npm test
      - name: Run TypeScript checks
        run: npm run typecheck
      - name: Build production container
        run: docker build --pull=false --tag nogita-ci:${{ github.sha }} .
      - name: Reject tracked local environment files
        shell: bash
        run: |
          tracked_sensitive="$(git ls-files | grep -E '(^|/)\.env($|\.)|(^|/)\.nogita-state(/|$)' | grep -v -E '(^|/)\.env\.example$|^\.env\.control\.example$' || true)"
          test -z "$tracked_sensitive"
